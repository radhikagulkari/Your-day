<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<title>Happy Men's Day 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#14123a; --bg2:#3b1450; --rose:#ff8fb1; --gold:#e7c25a; --gold2:#fff0b3; --ivory:#fff8ee;
    --goldgrad:linear-gradient(135deg,#b88a22,#fff0b3 45%,#e7c25a 60%,#b88a22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--ivory);
    background:radial-gradient(circle at 50% 0%,#5a2a73,transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg2));
    min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px;
  }
  .gold{background:var(--goldgrad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}

  /* floating sparkles */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .sp{position:absolute;bottom:-30px;color:var(--gold2);text-shadow:0 0 8px rgba(255,240,179,.8);animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-115vh) rotate(200deg);opacity:0}}
  .conf{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards;border-radius:2px}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .stage{position:relative;z-index:2;width:100%;max-width:380px;text-align:center}

  /* ---------- GIFT ---------- */
  #gift{transition:opacity .6s,transform .6s}
  #gift.gone{opacity:0;transform:scale(.6) translateY(40px);pointer-events:none;position:absolute;inset:0}
  .gift-title{font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold2);margin-bottom:6px}
  .gift-sub{font-style:italic;font-size:1.2rem;opacity:.85;margin-bottom:34px}
  .box{position:relative;width:170px;height:170px;margin:0 auto;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
  .box.shake{animation:shake .6s}
  @keyframes bob{50%{transform:translateY(-10px)}}
  @keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
  .base{position:absolute;bottom:0;left:10px;right:10px;height:120px;border-radius:6px 6px 12px 12px;
    background:linear-gradient(145deg,#c2255c,#7a1040);box-shadow:0 18px 30px rgba(0,0,0,.5)}
  .base::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:var(--goldgrad)}
  .lid{position:absolute;top:22px;left:0;right:0;height:50px;border-radius:8px;z-index:2;
    background:linear-gradient(145deg,#e0306f,#8f1448);box-shadow:0 6px 14px rgba(0,0,0,.4);
    transition:transform .8s cubic-bezier(.3,1.3,.5,1),opacity .8s}
  .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:var(--goldgrad)}
  .bow{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:2.6rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .box.open .lid{transform:translateY(-130px) rotate(-25deg);opacity:0}
  .glow{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff6c8;transform:translate(-50%,-50%);opacity:0}
  .box.open .glow{animation:flash .9s forwards}
  @keyframes flash{0%{opacity:1;box-shadow:0 0 0 0 #fff6c8}100%{opacity:0;box-shadow:0 0 0 300px #fff6c8}}
  .tap{margin-top:36px;font-family:'Cinzel Decorative',serif;font-size:.8rem;letter-spacing:4px;color:var(--gold);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.35}}

  /* ---------- CARD ---------- */
  #card{display:none}
  #card.show{display:block;animation:cardIn 1s cubic-bezier(.2,1.2,.4,1)}
  @keyframes cardIn{from{opacity:0;transform:scale(.7) translateY(60px) rotate(-3deg)}}
  .paper{position:relative;padding:26px 22px 28px;border-radius:22px;
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1.5px solid rgba(231,194,90,.7);backdrop-filter:blur(8px);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 6px rgba(231,194,90,.08)}
  .paper::before,.paper::after{content:"✦";position:absolute;color:var(--gold);font-size:1rem}
  .paper::before{top:10px;left:14px}.paper::after{bottom:10px;right:14px}
  .crown{font-size:1.8rem;animation:glow 3s infinite}
  @keyframes glow{50%{filter:drop-shadow(0 0 12px var(--gold2))}}
  .card-title{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:1.65rem;line-height:1.25;margin:4px 0 16px}
  .photo{width:170px;height:210px;margin:0 auto 18px;padding:5px;border-radius:999px 999px 14px 14px;background:var(--goldgrad);
    box-shadow:0 0 0 3px rgba(231,194,90,.25),0 14px 30px rgba(0,0,0,.5),0 0 40px rgba(231,194,90,.25);
    opacity:0;transform:scale(.8);transition:all .9s .5s}
  #card.show .photo{opacity:1;transform:none}
  .photo div{width:100%;height:100%;border-radius:999px 999px 10px 10px;overflow:hidden;border:2px solid var(--bg1)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 36%;transform:scale(1.5);transform-origin:50% 38%;display:block}
  .lines p{font-size:1.28rem;line-height:1.5;margin:6px 0;opacity:0;transform:translateY(14px);transition:all .8s}
  .lines p.in{opacity:1;transform:none}
  .lines p.hl{font-style:italic;color:var(--rose)}
  .sign{font-family:'Great Vibes',cursive;font-size:2rem;color:var(--gold2);margin-top:12px;opacity:0;transition:opacity 1s}
  .sign.in{opacity:1}
  .again{margin-top:14px;background:none;border:1px solid rgba(231,194,90,.6);color:var(--gold2);font-family:'Cormorant Garamond',serif;font-size:1rem;padding:8px 20px;border-radius:20px}
</style>
</head>
<body>
<div id="fx"></div>

<main class="stage">
  <!-- GIFT -->
  <div id="gift">
    <div class="gift-title">Tumhare liye ek gift 🎁</div>
    <div class="gift-sub">Kuch khaas chhupa hai andar…</div>
    <div class="box" id="box">
      <div class="base"></div>
      <div class="lid"><span class="bow">🎀</span></div>
      <div class="glow"></div>
    </div>
    <div class="tap">TAP TO OPEN</div>
  </div>

  <!-- CARD -->
  <div id="card">
    <div class="paper">
      <div class="crown">👑</div>
      <div class="card-title gold">Happy<br>Men's Day</div>
      <div class="photo"><div><img src="photos/hero.jpg" alt="photo"></div></div>
      <div class="lines" id="lines"></div>
      <div class="sign" id="sign"></div>
      <button class="again" id="again">↺ Phir se kholo</button>
    </div>
  </div>
</main>

<script>
/* ============ ✏️ YAHAN APNA CONTENT BADLO ============ */
const CONFIG = {
  from: "Tumhari Radhika 💙",      // apna naam
  lines: [
    "Tum jaise ho, bahut khaas ho.",
    "Tumhari smile mere din ko roshan kar deti hai,",
    "aur tumhari care mujhe sukoon deti hai.",
    {hl:"Hamesha aise hi rehna — apni tarah. ✨"}
  ]
};
/* ===================================================== */
const $ = s => document.querySelector(s);
const SP = ["✦","✧","✨","♛","❖"], COL = ["#ff8fb1","#e7c25a","#fff0b3","#8fd3ff","#c9a0ff"];

function spark(){
  const s=document.createElement("span"); s.className="sp"; s.textContent=SP[Math.random()*SP.length|0];
  s.style.left=Math.random()*100+"vw"; s.style.fontSize=(12+Math.random()*16)+"px"; s.style.animationDuration=(6+Math.random()*6)+"s";
  $("#fx").appendChild(s); setTimeout(()=>s.remove(),12500);
}
setInterval(spark,900);
function confetti(){
  for(let i=0;i<60;i++){
    const c=document.createElement("span"); c.className="conf";
    c.style.left=Math.random()*100+"vw"; c.style.background=COL[Math.random()*COL.length|0];
    c.style.animationDuration=(2+Math.random()*2.5)+"s"; c.style.animationDelay=(Math.random()*.6)+"s";
    $("#fx").appendChild(c); setTimeout(()=>c.remove(),5500);
  }
}

// build lines
const L=$("#lines");
CONFIG.lines.forEach(t=>{ const p=document.createElement("p"); if(typeof t==="object"){p.className="hl";p.textContent=t.hl}else p.textContent=t; L.appendChild(p); });
$("#sign").textContent="— "+CONFIG.from;

let busy=false;
function openGift(){
  if(busy) return; busy=true;
  const box=$("#box"); box.classList.add("shake");
  setTimeout(()=>{ box.classList.remove("shake"); box.classList.add("open"); confetti(); },600);
  setTimeout(()=>{ $("#gift").classList.add("gone"); $("#card").classList.add("show");
    [...L.children].forEach((p,i)=>setTimeout(()=>p.classList.add("in"),1300+i*900));
    setTimeout(()=>$("#sign").classList.add("in"),1300+L.children.length*900);
  },1700);
}
$("#box").addEventListener("click",openGift);
$("#again").addEventListener("click",()=>{
  $("#card").classList.remove("show"); [...L.children].forEach(p=>p.classList.remove("in")); $("#sign").classList.remove("in");
  const b=$("#box"); b.classList.remove("open"); $("#gift").classList.remove("gone"); busy=false;
});
</script>
</body>
</html>
